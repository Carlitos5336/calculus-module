
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "calculus-module"
version = "0.1.0"
description = "An experimental calculus library"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pandas>=1.1.0",
]

[tool.setuptools.packages.find]
include = ["calculus*"]
